<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Orbmerge — mobile</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07070b;
      overscroll-behavior: none;
    }

    body {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ddd;
    }

    #canvas-holder {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
    }

    /* ---- PARAM 1: neumorphic PUSH pad, bottom-left ---- */
    #pulse {
      position: fixed;
      left: calc(env(safe-area-inset-left, 0px) + 20px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      width: 88px;
      height: 88px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 50%;
      z-index: 10;
      cursor: pointer;
      touch-action: none;
      display: grid;
      place-items: center;
      color: #aeb6c2;
      font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .16em;
      /* the ring under the pad is the live `repulsion` level (--level 0..1) */
      background:
        radial-gradient(circle at 50% 50%, #15151b 0 55%, transparent 56%),
        conic-gradient(var(--accent, #49b6ff) calc(var(--level, 0) * 360deg), rgba(255, 255, 255, .07) 0);
      box-shadow:
        7px 7px 18px rgba(0, 0, 0, .6),
        -6px -6px 16px rgba(255, 255, 255, .045),
        inset 0 0 0 1px rgba(255, 255, 255, .03);
      transition: transform .09s ease, box-shadow .09s ease;
    }

    #pulse.on {
      transform: scale(.93);
      box-shadow:
        inset 6px 6px 14px rgba(0, 0, 0, .65),
        inset -4px -4px 10px rgba(255, 255, 255, .04);
    }

    /* ---- collapsible side panel, right edge ---- */
    #panel-tab {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 20;
      width: 27px;
      height: 64px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-right: none;
      border-radius: 11px 0 0 11px;
      background: rgba(18, 18, 22, .9);
      color: #cfcfd6;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: right .28s ease;
    }

    #panel-tab::before {
      content: "\2039";
      font-size: 19px;
      line-height: 1;
    }

    body.panel-open #panel-tab {
      right: min(320px, 82vw);
    }

    body.panel-open #panel-tab::before {
      content: "\203A";
    }

    #panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(320px, 82vw);
      z-index: 30;
      background: rgba(14, 14, 18, .94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-left: 1px solid rgba(255, 255, 255, .12);
      box-shadow: -12px 0 40px rgba(0, 0, 0, .5);
      transform: translateX(100%);
      transition: transform .28s ease;
      padding: calc(env(safe-area-inset-top, 0px) + 26px) 22px
               calc(env(safe-area-inset-bottom, 0px) + 24px);
      display: flex;
      flex-direction: column;
      gap: 28px;
      color: #dfe3ea;
    }

    body.panel-open #panel {
      transform: translateX(0);
    }

    #panel * {
      touch-action: auto;
    }

    #panel h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #8b93a1;
    }

    #panel .row {
      display: flex;
      flex-direction: column;
    }

    #panel label {
      font-size: 12px;
      letter-spacing: .06em;
      color: #aeb6c2;
      margin-bottom: 12px;
    }

    #color-input {
      width: 100%;
      height: 48px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    #panel input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .14);
      outline: none;
    }

    #panel input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent, #49b6ff);
      border: 3px solid #0e0e12;
      cursor: pointer;
    }

    #panel input[type=range]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent, #49b6ff);
      border: 3px solid #0e0e12;
      cursor: pointer;
    }

    #reset-btn {
      margin-top: auto;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 10px;
      background: rgba(255, 255, 255, .04);
      color: #dfe3ea;
      padding: 15px;
      font-size: 13px;
      letter-spacing: .08em;
      cursor: pointer;
    }

    #reset-btn:active {
      background: rgba(255, 255, 255, .1);
    }

    /* ---- start / motion-permission overlay ---- */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #07070b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity .4s ease;
    }

    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-overlay .big {
      font-size: 21px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #dfe3ea;
    }

    #start-overlay .sub {
      max-width: 280px;
      text-align: center;
      line-height: 1.6;
      font-size: 13px;
      letter-spacing: .04em;
      color: #8b93a1;
    }
  </style>
</head>

<body>
  <main id="canvas-holder"></main>

  <button id="pulse" type="button">PUSH</button>

  <div id="panel-tab" role="button" aria-label="toggle panel" tabindex="0"></div>
  <aside id="panel">
    <h1>orbmerge · mobile</h1>
    <div class="row">
      <label for="color-input">colour</label>
      <input id="color-input" type="color" value="#49b6ff">
    </div>
    <div class="row">
      <label for="size-input">blob size</label>
      <input id="size-input" type="range" min="18" max="90" step="1" value="42">
    </div>
    <button id="reset-btn" type="button">reset flock</button>
  </aside>

  <div id="start-overlay">
    <div class="big">orbmerge</div>
    <div class="sub">tap to start · PUSH repels the flock · shake the phone to speed it up</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
